<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compte — Deylo Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Saira:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div id="site-nav" data-active="compte.html"></div>
<main>
  <div class="container" style="padding-top:50px;padding-bottom:70px;max-width:520px">

    <div id="loggedOutView">
      <div class="eyebrow"><span class="dash"></span>Compte joueur</div>
      <h1 class="h1" style="font-size:38px">Connexion</h1>
      <p class="lead">Créez un compte pour sauvegarder votre progression (argent, voitures débloquées, records) sur tous vos appareils.</p>
      <button class="btn btn-block" id="btnDiscord" style="margin-top:22px;background:#5865f2;color:#fff;border:0">
        <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor" style="flex:0 0 auto"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
        Continuer avec Discord
      </button>
      <div style="display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text-4);font-size:11px;letter-spacing:.1em;text-transform:uppercase"><span style="flex:1;height:1px;background:rgba(var(--line-rgb),.14)"></span>ou<span style="flex:1;height:1px;background:rgba(var(--line-rgb),.14)"></span></div>
      <div class="tabs" style="display:flex;gap:8px;margin-bottom:18px">
        <button class="btn btn-ghost" id="tabLogin" style="flex:1">Connexion</button>
        <button class="btn btn-ghost" id="tabSignup" style="flex:1">Créer un compte</button>
      </div>
      <div id="msgArea"></div>

      <form id="loginForm" class="card">
        <div class="field"><label>Email</label><input type="email" id="loginEmail" required></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="loginPassword" required></div>
        <button class="btn btn-primary btn-block" type="submit">Se connecter →</button>
      </form>

      <form id="signupForm" class="card" style="display:none">
        <div class="field"><label>Pseudo</label><input type="text" id="suUsername" maxlength="16" required></div>
        <div class="field"><label>Email</label><input type="email" id="suEmail" required></div>
        <div class="field"><label>Mot de passe (8 caractères min.)</label><input type="password" id="suPassword" minlength="8" required></div>
        <button class="btn btn-primary btn-block" type="submit">Créer mon compte →</button>
      </form>
    </div>

    <div id="loggedInView" style="display:none">
      <div class="eyebrow"><span class="dash"></span>Mon profil</div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:8px">
        <img id="avatarImg" src="" alt="" style="display:none;width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid rgba(var(--accent-rgb),.5)">
        <h1 class="h1" style="font-size:38px;margin-top:0" id="welcomeName">Pilote</h1>
      </div>
      <div class="grid grid-auto" style="margin-top:26px">
        <div class="card"><div style="font-size:11px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase">Crédits</div><div style="font-family:'Saira Condensed';font-weight:900;font-size:30px;margin-top:6px" id="statMoney">—</div></div>
        <div class="card"><div style="font-size:11px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase">Voitures débloquées</div><div style="font-family:'Saira Condensed';font-weight:900;font-size:30px;margin-top:6px" id="statCars">—</div></div>
      </div>
      <div class="card" style="margin-top:18px">
        <div style="font-size:11px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase;margin-bottom:10px">🏆 Succès</div>
        <div class="badge-grid" id="badgeGrid"><div class="skeleton">Chargement…</div></div>
      </div>
      <div class="card" style="margin-top:18px">
        <div style="font-size:11px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase;margin-bottom:10px">🎟️ Code promo</div>
        <div id="codeMsg"></div>
        <div class="field"><input type="text" id="codeInput" maxlength="24" placeholder="Ex. DEYLO2026" style="text-transform:uppercase"></div>
        <button class="btn btn-primary btn-block" id="btnRedeemCode">Utiliser le code</button>
      </div>
      <div class="card" style="margin-top:18px">
        <div class="field"><label>Changer de pseudo</label><input type="text" id="newUsername" maxlength="16"></div>
        <button class="btn btn-ghost btn-block" id="btnSaveUsername">Enregistrer</button>
      </div>
      <button class="btn btn-ghost btn-block" id="btnLogout" style="margin-top:14px">Se déconnecter</button>
    </div>
  </div>
</main>
<footer class="footer">
  <div style="font-family:'Saira Condensed';font-weight:900;letter-spacing:.16em;color:var(--text-2);font-size:16px">DEYLO<span style="color:var(--accent)">·</span>GARAGE</div>
  <a href="index.html">← Retour à l'accueil</a>
</footer>
<script src="js/supabase-client.js"></script>
<script src="js/cars.js"></script>
<script src="js/auth.js"></script>
<script src="js/economy.js"></script>
<script src="js/nav.js"></script>
<script>
(function(){
  const msgArea = document.getElementById('msgArea');
  function msg(text, ok){ msgArea.innerHTML = '<div class="msg ' + (ok?'msg-ok':'msg-error') + '">' + text + '</div>'; }

  document.getElementById('tabLogin').addEventListener('click', ()=>{ document.getElementById('loginForm').style.display='block'; document.getElementById('signupForm').style.display='none'; });
  document.getElementById('tabSignup').addEventListener('click', ()=>{ document.getElementById('loginForm').style.display='none'; document.getElementById('signupForm').style.display='block'; });

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    try { await DG.Auth.signIn(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); }
    catch(err){ msg(err.message || 'Connexion impossible', false); }
  });

  document.getElementById('signupForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    try {
      await DG.Auth.signUp(document.getElementById('suEmail').value, document.getElementById('suPassword').value, document.getElementById('suUsername').value);
      msg('Compte créé — vérifiez votre email si une confirmation est requise, puis connectez-vous.', true);
    } catch(err){ msg(err.message || 'Inscription impossible', false); }
  });

  document.getElementById('btnLogout').addEventListener('click', ()=>DG.Auth.signOut());

  document.getElementById('btnDiscord').addEventListener('click', async ()=>{
    try { await DG.Auth.signInWithDiscord(); } catch(err){ msg(err.message || 'Connexion Discord impossible', false); }
  });

  document.getElementById('btnSaveUsername').addEventListener('click', async ()=>{
    const v = document.getElementById('newUsername').value.trim();
    if(!v) return;
    try { await DG.Auth.updateUsername(v); render(); } catch(err){ alert(err.message); }
  });

  document.getElementById('btnRedeemCode').addEventListener('click', async ()=>{
    const input = document.getElementById('codeInput');
    const codeMsg = document.getElementById('codeMsg');
    const code = input.value.trim();
    if(!code) return;
    const res = await DG.Economy.redeemCode(code);
    if(res.ok){
      const car = res.carId ? DG.carById(res.carId) : null;
      const parts = [];
      if(res.credits) parts.push('+' + res.credits + ' crédits');
      if(car) parts.push(car.name + ' débloquée');
      codeMsg.innerHTML = '<div class="msg msg-ok">Code activé : ' + (parts.join(' · ') || 'terminé') + ' !</div>';
      input.value = '';
    } else {
      codeMsg.innerHTML = '<div class="msg msg-error">' + res.error + '</div>';
    }
  });

  // Succès/trophées calcules a partir de my_stats() (parties jouees, records battus, etc).
  const BADGES = [
    { icon:'🔑', label:'Premier volant',    check:s=>s.cars_unlocked >= 2 },
    { icon:'🚗', label:'Collectionneur',    check:s=>s.cars_unlocked >= 6 },
    { icon:'🏁', label:'Garage complet',    check:s=>s.cars_unlocked >= DG.CARS.length },
    { icon:'🛣️', label:'Petit rouleur',     check:s=>s.games_played >= 10 },
    { icon:'⏱️', label:'Vétéran',           check:s=>s.games_played >= 50 },
    { icon:'💪', label:'Increvable',        check:s=>s.games_played >= 200 },
    { icon:'📈', label:'Recordman',         check:s=>s.records_beaten >= 5 },
    { icon:'👑', label:'Légende',           check:s=>s.records_beaten >= 15 },
    { icon:'🎯', label:'Défi relevé',       check:s=>s.daily_challenges_claimed >= 1 },
  ];

  let achievementsLoadedFor = null;
  async function loadAchievements(){
    if(achievementsLoadedFor === DG.Auth.user.id) return;
    achievementsLoadedFor = DG.Auth.user.id;
    const grid = document.getElementById('badgeGrid');
    try{
      const { data, error } = await DG.supabase.rpc('my_stats');
      if(error) throw error;
      grid.innerHTML = BADGES.map(b=>{
        const unlocked = b.check(data);
        return '<div class="badge' + (unlocked?' unlocked':'') + '"><div class="icon">' + b.icon + '</div><div class="label">' + b.label + '</div></div>';
      }).join('');
    } catch(e){
      grid.innerHTML = '<div class="skeleton">Indisponible</div>';
    }
  }

  function render(){
    const loggedIn = DG.Auth.isLoggedIn();
    document.getElementById('loggedOutView').style.display = loggedIn ? 'none' : 'block';
    document.getElementById('loggedInView').style.display = loggedIn ? 'block' : 'none';
    if(loggedIn){
      document.getElementById('welcomeName').textContent = 'Salut, ' + DG.Auth.displayName();
      document.getElementById('statMoney').textContent = '🪙 ' + DG.Economy.money.toLocaleString('fr-FR');
      document.getElementById('statCars').textContent = DG.Economy.unlocked.length + ' / ' + DG.CARS.length;
      document.getElementById('newUsername').value = DG.Auth.displayName();
      const avatarImg = document.getElementById('avatarImg');
      const avatar = DG.Auth.avatarUrl();
      if(avatar){ avatarImg.src = avatar; avatarImg.style.display = 'block'; } else { avatarImg.style.display = 'none'; }
      loadAchievements();
    } else {
      achievementsLoadedFor = null;
    }
  }
  DG.Auth.onChange(render);
  DG.Economy.onChange(render);
})();
</script>
</body>
</html>
